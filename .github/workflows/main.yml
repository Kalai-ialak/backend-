name: Local Docker Deploy with Telegram
 
on:
  push:
    branches:
      - main
 
jobs:
  start-notification:
    name: Send Start Notification
    runs-on: ubuntu-latest
 
    steps:
      - name: Send Telegram - Build Started
        run: |
          TOKEN=$(echo "${{ secrets.TELEGRAM_BOT_TOKEN }}" | tr -d '\n' | xargs)
          CHAT_ID=$(echo "${{ secrets.TELEGRAM_CHAT_ID }}" | tr -d '\n' | xargs)
 
          MESSAGE="🔨 Local Build Started 🚀
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          User: ${{ github.actor }}"
 
          curl -s -X POST https://api.telegram.org/bot$TOKEN/sendMessage \
            -d chat_id=$CHAT_ID \
            -d text="$MESSAGE"
 
  build-and-run:
    name: Build and Run Locally
    runs-on: ubuntu-latest
    needs: start-notification
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: Add .env file
        run: echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
 
      - name: Build Docker image
        run: docker build -t kalaiannam/staging.stobay.ai:latest .
 
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
 
      - name: Push Docker Image
        run: docker push kalaiannam/staging.stobay.ai:latest
 
      - name: Stop old container
        run: |
          docker stop web-stobay || true
          docker rm web-stobay || true
 
      - name: Run container
        run: |
          docker run -d -p 6009:6009 --name web-stobay kalaiannam/staging.stobay.ai:latest
 
      - name: Wait for container
        run: sleep 10
 
      - name: Verify container
        run: |
          echo "Checking container..."
 
          if docker ps | grep -q web-stobay; then
            echo "✅ Container running"
 
            for i in {1..10}; do
              if curl -s http://localhost:6009 > /dev/null; then
                echo "✅ App responding"
                exit 0
              fi
              echo "⏳ Retry $i..."
              sleep 3
            done
 
            echo "❌ App not responding"
            docker logs --tail=50 web-stobay
            exit 1
          else
            echo "❌ Container failed"
            docker logs web-stobay
            exit 1
          fi
 
  success-notification:
    name: Send Success Notification
    runs-on: ubuntu-latest
    needs: build-and-run
    if: needs.build-and-run.result == 'success'
 
    steps:
      # 🔍 DEBUG STEP (IMPORTANT)
      - name: Debug Telegram API
        run: |
          TOKEN=$(echo "${{ secrets.TELEGRAM_BOT_TOKEN }}" | tr -d '\n' | xargs)
          CHAT_ID=$(echo "${{ secrets.TELEGRAM_CHAT_ID }}" | tr -d '\n' | xargs)
 
          echo "🔍 Debugging Telegram..."
          echo "TOKEN length: ${#TOKEN}"
          echo "CHAT_ID: $CHAT_ID"
 
          RESPONSE=$(curl -s -X POST https://api.telegram.org/bot$TOKEN/sendMessage \
            -d chat_id=$CHAT_ID \
            -d text="DEBUG: GitHub success job working")
 
          echo "Telegram API Response:"
          echo "$RESPONSE"
 
      # ✅ ACTUAL SUCCESS MESSAGE
      - name: Send Telegram Success Message
        run: |
          TOKEN=$(echo "${{ secrets.TELEGRAM_BOT_TOKEN }}" | tr -d '\n' | xargs)
          CHAT_ID=$(echo "${{ secrets.TELEGRAM_CHAT_ID }}" | tr -d '\n' | xargs)
 
          MESSAGE="🎉 Local Deployment Successful
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          User: ${{ github.actor }}
          Port: 6009"
 
          curl -s -X POST https://api.telegram.org/bot$TOKEN/sendMessage \
            -d chat_id=$CHAT_ID \
            -d text="$MESSAGE"
 
  failure-notification:
    name: Send Failure Notification
    runs-on: ubuntu-latest
    needs: build-and-run
    if: needs.build-and-run.result == 'failure'
 
    steps:
      - name: Send Telegram Failure Message
        run: |
          TOKEN=$(echo "${{ secrets.TELEGRAM_BOT_TOKEN }}" | tr -d '\n' | xargs)
          CHAT_ID=$(echo "${{ secrets.TELEGRAM_CHAT_ID }}" | tr -d '\n' | xargs)
 
          MESSAGE="💥 Local Deployment Failed
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          User: ${{ github.actor }}"
 
          curl -s -X POST https://api.telegram.org/bot$TOKEN/sendMessage \
            -d chat_id=$CHAT_ID \
            -d text="$MESSAGE"
